<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Бурмал Ставка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Courier New',monospace;
  background:linear-gradient(180deg,#0a0f1e 0%,#0f1a30 100%);
  color:#fff;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 12px;
  background:linear-gradient(135deg,#1a2f5a 0%,#0f1e3d 100%);
  border:2px solid #2563eb;
  border-radius:10px;
  box-shadow:0 0 20px rgba(37,99,235,.4);
}
h1{
  font-size:15px;
  letter-spacing:1px;
  text-shadow:0 0 10px #2563eb;
}
.balance{
  background:linear-gradient(135deg,#10b981 0%,#059669 100%);
  padding:5px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 0 10px rgba(16,185,129,.6);
}
#arenaWrap{position:relative;width:100%}
canvas{
  width:100%;
  image-rendering:pixelated;
  border:3px solid #2563eb;
  border-radius:10px;
  display:block;
  box-shadow:0 0 25px rgba(37,99,235,.5),inset 0 0 50px rgba(0,0,0,.5);
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
button{
  border:none;
  color:#fff;
  padding:14px 6px;
  border-radius:10px;
  font-size:12px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  letter-spacing:.5px;
  transition:transform .1s;
}
#btn-spin{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 0 #92400e,0 0 20px rgba(245,158,11,.5)}
#btn-fight{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 0 #991b1b,0 0 20px rgba(239,68,68,.5)}
#btn-pvp{background:linear-gradient(135deg,#8b5cf6,#7c3aed);box-shadow:0 4px 0 #5b21b6,0 0 20px rgba(139,92,246,.5)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.log{
  background:linear-gradient(135deg,#1a2f5a,#0f1e3d);
  border:2px solid #2563eb;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 0 15px rgba(37,99,235,.3);
}
.slot-reel{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:36px;
  min-height:50px;
  align-items:center;
}
.slot-reel span{
  display:inline-block;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.5));
}
</style>
</head>
<body>

<header>
  <h1>⚔️ БУРМАЛ СТАВКА</h1>
  <div class="balance">💵 <span id="balance">1000</span></div>
</header>

<div id="arenaWrap">
  <canvas id="arena" width="480" height="240"></canvas>
</div>

<div class="controls">
  <button id="btn-spin">🎲 СЛОТ</button>
  <button id="btn-fight">🥊 БОЙ</button>
  <button id="btn-pvp">⚔️ PVP</button>
</div>

<div class="log" id="log">Готов к бою! Выбери действие.</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

let state = {
  balance: 1000,
  fighters: [
    { name: 'Мулатов', x: 60, y: 120, hp: 100, hpMax: 100, color: '#ef4444', dark: '#7f1d1d', dir: 1 },
    { name: 'Дёмкин',  x: 380, y: 120, hp: 100, hpMax: 100, color: '#3b82f6', dark: '#1e3a8a', dir: -1 },
  ],
  shake: 0,
  particles: [],
  crowdOffset: 0,
  screenFlash: 0,
};

function updateUI() {
  document.getElementById('balance').textContent = state.balance;
}

function log(text) {
  logEl.textContent = text;
}

// ---- Рисование пиксельного бойца ----
function drawFighter(f, t) {
  const px = 4; // размер пикселя
  const bob = Math.sin(t / 200) * 2; // лёгкое покачивание
  const x = f.x;
  const y = f.y + bob;

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath();
  ctx.ellipse(x + 14, f.y + 42, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ноги
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x + 6, y + 28, px * 2, px * 3);
  ctx.fillRect(x + 18, y + 28, px * 2, px * 3);

  // Шорты
  ctx.fillStyle = f.dark;
  ctx.fillRect(x + 4, y + 20, px * 6, px * 2);

  // Тело
  ctx.fillStyle = f.color;
  ctx.fillRect(x + 6, y + 8, px * 4, px * 3);
  // блик
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x + 6, y + 8, px, px * 3);

  // Руки (боксёрская стойка)
  ctx.fillStyle = f.color;
  ctx.fillRect(x + 2, y + 10, px, px * 3);
  ctx.fillRect(x + 22, y + 10, px, px * 3);

  // Кулаки (перчатки)
  ctx.fillStyle = f.dark;
  ctx.fillRect(x + 1, y + 8, px * 1.5, px * 1.5);
  ctx.fillRect(x + 22, y + 8, px * 1.5, px * 1.5);

  // Голова
  ctx.fillStyle = f.color;
  ctx.fillRect(x + 8, y - 4, px * 3, px * 3);

  // Глаза
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 9, y + 1, px * .6, px * .6);
  ctx.fillRect(x + 13, y + 1, px * .6, px * .6);

  // Имя
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(f.name, x + 16, y - 12);

  // HP-бар над именем
  const barW = 44, barH = 5;
  const barX = x + 16 - barW / 2;
  const barY = y - 28;
  ctx.fillStyle = '#000';
  ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
  ctx.fillStyle = '#334155';
  ctx.fillRect(barX, barY, barW, barH);
  const hpRatio = Math.max(0, f.hp / f.hpMax);
  const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  grad.addColorStop(0, '#22c55e');
  grad.addColorStop(1, '#16a34a');
  ctx.fillStyle = grad;
  ctx.fillRect(barX, barY, barW * hpRatio, barH);
  // обводка
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX - 1, barY - 1, barW + 2, barH + 2);
}

function drawCrowd(t) {
  // Мерцающая толпа сверху
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, canvas.width, 40);
  for (let i = 0; i < 80; i++) {
    const x = (i * 6 + state.crowdOffset) % canvas.width;
    const y = 5 + (i % 4) * 8;
    const bright = 60 + Math.sin(t / 300 + i) * 40;
    ctx.fillStyle = `rgb(${bright},${bright},${bright})`;
    ctx.fillRect(x, y, 3, 3);
  }
}

function drawArena(t) {
  // Фон — октагон
  const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grd.addColorStop(0, '#0f172a');
  grd.addColorStop(.5, '#1e293b');
  grd.addColorStop(1, '#0f172a');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawCrowd(t);

  // Пол ринга
  ctx.fillStyle = '#1a2f5a';
  ctx.fillRect(0, 100, canvas.width, canvas.height - 100);

  // Сетка октагона
  ctx.strokeStyle = 'rgba(100,150,255,.15)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 16) {
    ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 40; y < canvas.height; y += 16) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Прожектор сверху
  const spotGrd = ctx.createRadialGradient(canvas.width/2, 40, 20, canvas.width/2, 40, 200);
  spotGrd.addColorStop(0, 'rgba(255,255,220,.15)');
  spotGrd.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = spotGrd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Полосы прожекторов
  ctx.save();
  ctx.globalAlpha = .08;
  ctx.fillStyle = '#ffffdd';
  ctx.beginPath();
  ctx.moveTo(150, 0); ctx.lineTo(180, 0); ctx.lineTo(240, canvas.height); ctx.lineTo(180, canvas.height);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(300, 0); ctx.lineTo(330, 0); ctx.lineTo(300, canvas.height); ctx.lineTo(240, canvas.height);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  state.particles = state.particles.filter(p => p.life > 0);
  state.particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.font = `bold ${p.size}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life--;
  });
}

function draw(t) {
  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random() - .5) * state.shake, (Math.random() - .5) * state.shake);
    state.shake *= 0.85;
    if (state.shake < .5) state.shake = 0;
  }

  drawArena(t);
  state.fighters.forEach(f => drawFighter(f, t));
  drawParticles();

  // Вспышка экрана при ударе
  if (state.screenFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${state.screenFlash / 100})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    state.screenFlash *= 0.8;
    if (state.screenFlash < 5) state.screenFlash = 0;
  }
  ctx.restore();
}

function spawnDamage(x, y, dmg, crit=false) {
  state.particles.push({
    x, y, vy: -2, vx: (Math.random() - .5) * 2,
    text: `-${dmg}${crit ? '!' : ''}`,
    color: crit ? '#fbbf24' : '#ef4444',
    size: crit ? 22 : 16,
    life: 60, maxLife: 60,
  });
}

function spawnHitFx(x, y) {
  for (let i = 0; i < 8; i++) {
    state.particles.push({
      x, y,
      vx: (Math.random() - .5) * 6,
      vy: (Math.random() - .5) * 6 - 1,
      text: '✦',
      color: '#fbbf24',
      size: 12 + Math.random() * 8,
      life: 25, maxLife: 25,
    });
  }
}

// ---- Анимационный цикл ----
let animT = 0;
function loop() {
  animT += 16;
  state.crowdOffset += 0.3;
  draw(animT);
  requestAnimationFrame(loop);
}
loop();
updateUI();

// ---- Слот ----
document.getElementById('btn-spin').onclick = async () => {
  const symbols = ['🍫', '🍩', '🍒', '💎', '7️⃣', '🍋'];
  log('🎰 Крутим барабаны...');

  const finalReel = [
    symbols[Math.floor(Math.random() * symbols.length)],
    symbols[Math.floor(Math.random() * symbols.length)],
    symbols[Math.floor(Math.random() * symbols.length)],
  ];

  // Анимация вращения 1.2 секунды
  for (let frame = 0; frame < 15; frame++) {
    const rand = [
      symbols[Math.floor(Math.random() * symbols.length)],
      symbols[Math.floor(Math.random() * symbols.length)],
      symbols[Math.floor(Math.random() * symbols.length)],
    ];
    logEl.innerHTML = `<div class="slot-reel"><span>${rand[0]}</span><span>${rand[1]}</span><span>${rand[2]}</span></div>`;
    await new Promise(r => setTimeout(r, 80));
  }

  logEl.innerHTML = `<div class="slot-reel"><span>${finalReel[0]}</span><span>${finalReel[1]}</span><span>${finalReel[2]}</span></div>`;

  let win = 0;
  if (finalReel[0] === finalReel[1] && finalReel[1] === finalReel[2]) win = 300;
  else if (finalReel[0] === finalReel[1] || finalReel[1] === finalReel[2] || finalReel[0] === finalReel[2]) win = 60;

  state.balance -= 100;
  state.balance += win;
  updateUI();

  await new Promise(r => setTimeout(r, 400));
  if (win > 0) {
    log(`🎉 ${finalReel.join(' ')} → +${win} монет!`);
    state.screenFlash = 60;
  } else {
    log(`😢 ${finalReel.join(' ')} → -100 монет`);
  }
  if (tg) tg.HapticFeedback.impactOccurred(win > 0 ? 'heavy' : 'light');
};

// ---- Бой ----
document.getElementById('btn-fight').onclick = async () => {
  const f1 = state.fighters[0];
  const f2 = state.fighters[1];
  f1.hp = f1.hpMax;
  f2.hp = f2.hpMax;

  log('🥊 Бой начался!');
  f1.x = 60; f2.x = 380;

  const battleInterval = setInterval(() => {
    // Движение
    f1.x += (Math.random() - 0.4) * 12;
    f2.x += (Math.random() - 0.6) * 12;
    f1.x = Math.max(20, Math.min(220, f1.x));
    f2.x = Math.max(240, Math.min(440, f2.x));
  }, 100);

  let turn = 0;
  while (f1.hp > 0 && f2.hp > 0 && turn < 30) {
    await new Promise(r => setTimeout(r, 500));
    const attacker = Math.random() < 0.5 ? f1 : f2;
    const defender = attacker === f1 ? f2 : f1;
    const crit = Math.random() < 0.15;
    const dmg = Math.floor(Math.random() * 15) + 10 + (crit ? 10 : 0);
    defender.hp = Math.max(0, defender.hp - dmg);

    spawnDamage(defender.x + 16, defender.y - 5, dmg, crit);
    spawnHitFx(defender.x + 16, defender.y + 16);
    state.shake = crit ? 14 : 8;
    state.screenFlash = crit ? 50 : 25;

    if (tg) tg.HapticFeedback.impactOccurred(crit ? 'heavy' : 'medium');
    turn++;
  }

  clearInterval(battleInterval);

  if (f1.hp <= 0 || f2.hp <= 0 || turn >= 30) {
    const winner = f1.hp > f2.hp ? f1 : f2;
    state.balance += 200;
    updateUI();
    log(`🏆 Победил ${winner.name}! +200 монет`);
    setTimeout(() => {
      f1.hp = f1.hpMax; f2.hp = f2.hpMax;
      f1.x = 60; f2.x = 380;
    }, 1500);
  }
};

// ---- PvP ----
document.getElementById('btn-pvp').onclick = () => {
  if (tg) tg.showAlert('PvP скоро появится!');
  else alert('PvP скоро появится!');
};

</script>
</body>
</html>
